# Builds the Go click-stream-processor and deploys it to Azure Container Apps.
#
# App Service could not run this image: the Dockerfile used to default to arm64
# and App Service for Containers is amd64-only, so it started and exited at once.
# Everything here is amd64 — the arm64 OCI Ampere box is gone.

name: Build and deploy click-stream-processor to Azure Container Apps

# Manual-trigger only for now. The push trigger is commented out deliberately:
# the deploy job runs `az containerapp update`, which needs the Container App to
# already exist, and it authenticates with OIDC secrets that have not been
# created yet (MusicPlus has no managed identity, unlike organizer and
# learning-curve). Uncomment the push block once both are in place.
#
# on:
#   push:
#     paths:
#       - click-stream-processor/**
#       - .github/workflows/click-stream-processor.yml
#     branches:
#       - master
#       - main
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/click-stream-processor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: click-stream-processor
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # OIDC JWT for azure/login
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_MUSICK }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_MUSICK }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_MUSICK }}

      # Only the image tag is updated. Everything else about the app — env vars,
      # secrets, the /etc/secret volume, scaling — is owned by Terraform in
      # LifekitInfra/musick/click-stream-processor, and this must not touch it.
      - name: Update Container App image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name click-stream-processor \
              --resource-group musick \
              --image ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
